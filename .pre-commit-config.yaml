# Pre-commit hooks. Install them with: make install-hooks
#
# ★ The gitleaks revision is pinned. "latest" would let a new rule turn every
#   commit red on a day nobody touched the security setup — and the rule that
#   fires on your code is the rule you cannot fix by editing your code.
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: gofmt
        name: gofmt
        entry: scripts/check-gofmt.sh
        language: script
        types: [go]
