<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" role="img" aria-label="openheron">
  <title>openheron</title>
  <!--
    The openheron mark: a stylized H — technology and nature combined
    Letter — H is openheron's initial; the left stem is drawn as a heron's neck (narrow at the top, wide at the bottom), with the heron's long beak growing out of the upper left
    Nature — the heron's head: a slender beak and an eye at its base
    Technology — the right stem continues into a right-angled circuit trace whose end is a detached data point
    Composition — the body sits centered and nearly fills the 48×48 canvas, on a transparent background
             (with a dark outline around the outside, which only shows on light backgrounds so the favicon stays readable there)

    ★ This file is the **source** of the mark. The interface renders it inline
      (src/components/brand-mark.generated.tsx), and that file is generated from
      this one by scripts/generate-brand-mark.ts — do not draw the mark twice.

    ★ The `class` attributes below are the parts' handles. They change nothing
      in the rendering (a favicon has no stylesheet), but they are what the
      interface's stylesheet animates:
        mark-parts — the body as one group; the two masks carry the same class,
                     so the fill and the outline fade together and never drift
                     apart
        mark-beak / mark-neck / mark-stem / mark-bar — the four parts
        mark-eye   — the hole in the beak; it belongs to the body group, so it
                     fades with the beak instead of staying behind as a speck
        mark-trace — the circuit trace, outside the masks
        mark-dot   — the data point, outside the masks
  -->
  <defs>
    <linearGradient id="openheronBrand" x1="3" y1="3" x2="45" y2="45" gradientUnits="userSpaceOnUse">
      <stop stop-color="#e6ff5c" />
      <stop offset=".55" stop-color="#dcfd35" />
      <stop offset="1" stop-color="#8fe3ff" />
    </linearGradient>

    <!-- main shape: beak / neck / right stem / crossbar -->
    <mask id="openheronBody" maskUnits="userSpaceOnUse" x="0" y="0" width="48" height="48">
      <g transform="translate(24 24) scale(1.3) translate(-28.2 -24.5)">
        <g class="mark-parts" fill="#fff">
          <path class="mark-beak" d="M12 11.5 L43 8 L12 17 Z" />
          <path class="mark-neck" d="M12.5 16 L19 16.4 C19.4 24 19.8 32 20.6 41 L13.6 41 C13.8 32 13 24 12.5 16 Z" />
          <rect class="mark-stem" x="28" y="13" width="6.6" height="28" rx="1.4" />
          <rect class="mark-bar" x="12.5" y="24" width="15.5" height="6.6" rx="1.4" />
          <!-- eye: a hole in the body, so it carries the group's opacity -->
          <circle class="mark-eye" cx="17.6" cy="13.4" r="1.55" fill="#000" />
        </g>
      </g>
    </mask>

    <!-- solid silhouette for the outline (5% larger, laid under the main shape) -->
    <mask id="openheronHalo" maskUnits="userSpaceOnUse" x="0" y="0" width="48" height="48">
      <g transform="translate(24 24) scale(1.365) translate(-28.2 -24.5)">
        <g class="mark-parts" fill="#fff">
          <path class="mark-beak" d="M12 11.5 L43 8 L12 17 Z" />
          <path class="mark-neck" d="M12.5 16 L19 16.4 C19.4 24 19.8 32 20.6 41 L13.6 41 C13.8 32 13 24 12.5 16 Z" />
          <rect class="mark-stem" x="28" y="13" width="6.6" height="28" rx="1.4" />
          <rect class="mark-bar" x="12.5" y="24" width="15.5" height="6.6" rx="1.4" />
        </g>
      </g>
    </mask>
  </defs>

  <!-- dark outline (visible on light backgrounds, invisible on dark ones) -->
  <rect width="48" height="48" fill="#040319" mask="url(#openheronHalo)" />
  <!-- main shape -->
  <rect width="48" height="48" fill="url(#openheronBrand)" mask="url(#openheronBody)" />

  <!-- circuit trace + data point -->
  <g
    stroke="url(#openheronBrand)"
    stroke-width="1.9"
    fill="none"
    stroke-linejoin="miter"
    transform="translate(24 24) scale(1.3) translate(-28.2 -24.5)"
  >
    <!-- pathLength="1" normalizes the dash: the trace is drawn with a dash of
         one unit, so the interface's stylesheet does not have to know how long
         the path is -->
    <path class="mark-trace" pathLength="1" d="M34.6 27.3 L40 27.3 L40 17.5"></path>
  </g>
  <circle
    class="mark-dot"
    cx="42.6"
    cy="17.5"
    r="2.2"
    fill="#040319"
    transform="translate(24 24) scale(1.3) translate(-28.2 -24.5)"
  ></circle>
  <circle
    class="mark-dot"
    cx="42.6"
    cy="17.5"
    r="1.7"
    fill="#8fe3ff"
    transform="translate(24 24) scale(1.3) translate(-28.2 -24.5)"
  ></circle>
</svg>
