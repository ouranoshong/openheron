# air — automatic rebuild + restart for Go during development.
#
# ★ Why "rebuild + restart" rather than the frontend's HMR:
#
#   Go has no module-level hot replacement, so restarting the process is the
#   standard answer. For openheron that path is cheap, because **the state that
#   has to survive a restart already lives on disk**:
#
#     Session history    session.jsonl         read straight back by Inspect at startup
#     Pending approvals  state.json + checkpoint  Inspect checks that the two are paired
#     Configuration      files                already hot-reloaded (main.go's watch)
#
#   The only thing actually lost is the **turn in flight** (a model call that is
#   streaming back). Measured incremental rebuild ~1.1s, and about 1.5s from
#   editing a line to seeing the effect — no need for anything cleverer.
#
# ★ working_dir must be the repository root.
#   openheron resolves relative paths against the project root
#   (config.Service.ResolveDir), not against the process cwd.
#   Starting it elsewhere gives you
#   `agents/main.md does not exist or could not be parsed`.
#
# ★ The .exe suffix on the dev binary is mandatory on Windows: air starts the
#   binary through PowerShell, which refuses a path without it — the runner
#   prints "CMD will not recognize non .exe file for execution". A bare
#   `go build` appends the suffix on Windows, but `go build -o` uses the name
#   exactly as given, so bin, cmd and full_bin all have to spell it out.
#   Unix ignores the extension, so one config works on every platform.

root = "."
tmp_dir = "tmp"

[build]
  # The binary goes into tmp/ rather than bin/: bin/ is the release artifact
  # directory and should not be overwritten by a half-finished dev build —
  # mixing `task build`'s output with the debug output is confusing.
  bin = "tmp/openheron-dev.exe"
  cmd = "go build -o tmp/openheron-dev.exe ."
  # A package containing test files recompiles as soon as it changes: much of
  # openheron's behaviour is written in _test.go (like the comments that pin
  # down counter-intuitive designs), and not recompiling after a test edit
  # makes people think the code did not take effect.
  include_ext = ["go", "yaml", "yml", "tmpl"]
  exclude_dir = ["tmp", "bin", "web", "docs", "a2ui/web"]
  # web/ is excluded entirely: the frontend is the Vite dev server's job, its
  # HMR is millisecond-fast, and there is no reason for the Go side to rebuild
  # a 40MB binary because of a frontend change.
  exclude_file = []
  # An empty list excludes **nothing** — it is not air's default. air only
  # falls back to its own defaults (["_test.go"], 1000ms delay, …) when the
  # config file cannot be read at all; a file that exists is unmarshalled into
  # a zero-valued struct, so every key it does not set is simply absent.
  #
  # So today editing a _test.go **does** trigger a rebuild — which is the
  # behaviour the include_ext comment above wants. It costs ~1.1s, and
  # `go build` does not compile test files at all, so the binary it produces
  # is identical; running the tests is `task test`'s job, not air's.
  #
  # docs/ and .md are not in include_ext, so they never trigger a rebuild —
  # no need to declare them again.
  exclude_regex = []
  delay = 200
  stop_on_error = false
  # ★ On Windows this setting changes nothing but the noise: the Windows path
  #   always uses TASKKILL, and it says so on every restart
  #   ("send_interrupt is not supported on Windows, using TASKKILL instead").
  #   It is kept because the Unix path uses it for a **graceful** stop, and
  #   openheron has state to flush when it goes down.
  send_interrupt = true
  # ★ The delay between the interrupt and the hard kill — **on Unix only**.
  #   air reads it in `util_unix.go` / `util_linux.go`; the Windows path
  #   (`util_windows.go`) goes straight to TASKKILL and never looks at it.
  #   So the "give the port time to come back" it buys is a Unix fact — the
  #   Windows port race is handled by the sweep below.
  kill_delay = "500ms"
  post_cmd = []

# ★ The Windows-only sweep, and why it exists.
#
#   On Windows the server is a **grandchild**: air starts it through
#   PowerShell (`powershell -NoProfile -NonInteractive -Command ...`), and the
#   kill targets that wrapper with `TASKKILL /F /T /PID`. The tree kill can
#   miss the grandchild — and an orphan that still holds :8080 makes every
#   later instance die with "listen tcp :8080: bind: Only one usage of each
#   socket address", which reads like a build failure and is not one.
#
#   ★ air runs pre_cmd **after** it stopped the current instance and **before**
#   it starts the new one, so this is the one window in which the port can be
#   made sure to be free. By image name, so an orphan is caught whatever its
#   parent was.
#
#   `exit 0` keeps the sweep quiet: nothing to kill is not an error, and air
#   logs a failed pre_cmd on every build otherwise.
#
#   ★ It ends **every** openheron-dev on the machine, including one started by
#   hand — only one of them can hold the port anyway.
[build.windows]
  pre_cmd = ["Get-Process openheron-dev -ErrorAction SilentlyContinue | Stop-Process -Force; exit 0"]

[run]
  # Reuse the default port that Vite proxies to. During development the
  # frontend is on :5173 and the proxy points here.
  full_bin = "tmp/openheron-dev.exe"
  # The frontend hot-reloads through Vite, so there is no need to watch the
  # static directory on every restart.
  include_dir = ["agents", "llm", "policy", "skills"]
  # Forgetting to set it is harmless, but setting it avoids the debugging
  # mistake of thinking "my config change did not take effect" — config files
  # have their own hot reload, which is far faster than restarting the process.
  kill_delay = "500ms"
  send_interrupt = true
  log = "tmp/air.log"

[misc]
  # Runs at the project root rather than in a global config like ~/.air/rs —
  # so it follows automatically when you switch machines or projects.
  clean_on_exit = true
