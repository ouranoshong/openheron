# openheron CI — checks on every push, and the release on a tag.
#
# ★ One file, one reason: the release job **waits for the checks**, so a tag
#   on a red commit publishes nothing. Two workflow files could not express
#   that (a job cannot `needs:` a job in another workflow), so they would
#   have to re-run the checks here — the same recipe in two places.
#
# ★ The commands are the repo's own: `task lint-go`, `task test`,
#   `task test-race`, `task test-e2e`. What CI runs is what a developer runs
#   locally; the recipe stays in Taskfile.yml.
#
# ★ The smokes are **not** here: `task smoke` needs a model that answers, and
#   a model that answers is not reproducible in CI. The E2E uses the fake
#   backend it ships with — that half is deterministic, so it belongs here.
#
# ★ Task is not preinstalled on the runners, and an installed binary is local
#   to one job: every job that calls `task` installs it with setup-task.

name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: "release this tag (e.g. v0.1.0); leave empty to only run the checks"
        required: false
        type: string

# ★ A new push makes the previous run pointless — cancel it.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  go:
    name: go (vet + gofmt + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          # ★ The version comes from go.mod, not from a literal here: the two
          #   would drift, and the drift is a build that fails on the runner
          #   and nowhere else.
          go-version-file: go.mod
          cache: true
      - name: install Task
        uses: go-task/setup-task@v2
      - run: task lint-go
      - run: task test
      # ★ The race detector is a **step in this job**, not a job of its own:
      #   the branch protection already requires this job's name, so a step
      #   here is covered by it — while a new job would be a check that
      #   nothing waits for. The job's name stays as it is for that reason.
      - name: race detector
        run: task test-race
        env:
          # ★ The detector needs cgo, and the runner's default is not
          #   something to rely on: -race refuses to build without it.
          CGO_ENABLED: "1"

  web:
    name: web (lint + types + unit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - name: install Task
        uses: go-task/setup-task@v2
      - name: install the dependencies
        working-directory: web
        run: bun install --frozen-lockfile
      - run: task lint-web
      - name: unit tests
        working-directory: web
        run: bun run test:unit

  e2e:
    name: e2e (playwright, fake backend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - name: install Task
        uses: go-task/setup-task@v2
      - name: install the dependencies
        working-directory: web
        run: bun install --frozen-lockfile
      - name: install the browser
        working-directory: web
        # ★ Only chromium: the config declares one project, and installing
        #   every browser would cost minutes for nothing.
        # ★ The browsers come from a CDN and the system dependencies come
        #   from the Ubuntu archive: neither belongs to us, and a runner that
        #   cannot fetch them fails the run for a reason that has nothing to
        #   do with the code. The step is retried — the install is not
        #   resumable, so the whole thing runs again — and a second failure
        #   is still a failure.
        run: |
          for attempt in 1 2 3; do
            if bun x playwright install --with-deps chromium; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "::warning::the browser install failed (attempt ${attempt} of 3), retrying"
              sleep $((attempt * 15))
            fi
          done
          echo "::error::the browser install failed three times"
          exit 1
      - name: e2e
        # ★ The command stays the repo's own (`task test-e2e`); the tee is
        #   only there so that a failure can be summarized **where it can be
        #   read**: the job log and the artifacts need authentication, the
        #   step summary does not. A CI that fails without saying what failed
        #   is a CI nobody can act on.
        run: |
          set -o pipefail
          task test-e2e 2>&1 | tee /tmp/e2e.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            summary=$(grep -E "✘|[0-9]+\) |Error:|Timed out|failed|passed" /tmp/e2e.log \
              | tail -15 | tr '\n' ' ' | cut -c1-900)
            echo "::error title=E2E failed::${summary}"
            {
              echo "### E2E failed"
              echo '```'
              echo "${summary}"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"
      - name: keep the report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            web/playwright-report/
            /tmp/e2e.log
          retention-days: 7

  release:
    name: release
    # ★ A tag on a red commit publishes nothing: the checks come first.
    #
    #   ★ The string literals are **single** quotes: GitHub's expression
    #     parser does not accept double quotes, and the whole workflow file is
    #     rejected when one expression does not parse (which shows up as a
    #     failed run with zero jobs, not as a failing job).
    # ★ The release waits for the secret scan too: a tag whose commit holds a
    #   key should not become a published release.
    needs: [go, web, e2e, secrets]
    if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # ★ The tag, not `git describe`: a shallow clone has no tags, and the
      #   tag is the version the release is published under anyway.
      VERSION: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          # ★ Full history: `task release` reads its fallback version from
          #   `git describe --tags`, and a shallow clone would find no tag.
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: oven-sh/setup-bun@v2
      - name: install Task
        uses: go-task/setup-task@v2
      - name: build the artifacts
        # ★ `task release` builds the frontend **first**: web/dist is the
        #   target of //go:embed, so building the backend first would publish
        #   a binary with no interface.
        #
        #   ★ VERSION reaches the build through the environment: Task's
        #   `VERSION` var falls back to `git describe` only when the
        #   environment does not set it, so the tag wins over the default.
        run: task release
      - name: check the version inside the artifact
        run: |
          set -euo pipefail
          dir="openheron_${VERSION}_linux_amd64"
          tar -xzf "dist/${dir}.tar.gz" -C /tmp
          got="$(/tmp/${dir}/openheron version)"
          echo "the binary reports: ${got}"
          if [ "$got" != "$VERSION" ]; then
            echo "the version was not stamped into the binary" >&2
            exit 1
          fi
      - name: keep the assets for the install check
        # ★ The install job installs **these** bytes — the same ones the
        #   release publishes. Handing them over as an artifact avoids
        #   depending on a draft being downloadable: a draft's assets are
        #   not reachable by tag, so `gh release download` cannot fetch them.
        uses: actions/upload-artifact@v7
        with:
          name: release-assets
          path: dist/
          retention-days: 1
      - name: publish
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.VERSION }}
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          # ★ Draft first: the release only goes public after the install job
          #   has installed the very assets this job produced. A release that
          #   nobody can install is a bad thing to have published already.
          draft: true

  install:
    name: install (${{ matrix.os }}-${{ matrix.arch }})
    # ★ The assets are installed and run on every platform we publish for, so
    #   "the release works" means the binary was actually installed and
    #   reported its version — not that a tarball existed.
    needs: [release]
    if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
    runs-on: ${{ matrix.runner }}
    permissions:
      # ★ Read only: this job installs and runs, it publishes nothing.
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            os: linux
            arch: amd64
            script: sh
          - runner: ubuntu-24.04-arm
            os: linux
            arch: arm64
            script: sh
          - runner: macos-latest
            os: darwin
            arch: arm64
            script: sh
          # ★ macos-15-intel, not macos-13: the macOS 13 runner image was
          #   retired on 2025-12-04, and a job on a retired label sits in the
          #   queue forever — the release waits on it, so the release waits
          #   forever. macos-15-intel is GitHub's x86_64 macOS label.
          - runner: macos-15-intel
            os: darwin
            arch: amd64
            script: sh
          - runner: windows-latest
            os: windows
            arch: amd64
            script: ps1
    env:
      VERSION: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
      - name: get the assets the release job built
        uses: actions/download-artifact@v8
        with:
          name: release-assets
          path: assets
      - name: install it
        if: matrix.script == 'sh'
        shell: bash
        run: |
          set -euo pipefail
          archive=$(ls assets/openheron_${VERSION}_${{ matrix.os }}_${{ matrix.arch }}.*)
          export OPENHERON_ASSET="$archive"
          export OPENHERON_CHECKSUMS="assets/checksums.txt"
          export OPENHERON_VERSION="$VERSION"
          export INSTALL_DIR="$HOME/.local/bin"
          # ★ The reason goes into an annotation, not only into the log: the
          #   job log is readable with admin rights alone, and an annotation
          #   is readable from the API by anyone. The installer prints its
          #   reason as "openheron: ...", so that is the line to report.
          # ★ The output is captured, not teed: a "tee /dev/stderr" in the
          #   pipeline makes the *step* fail when tee cannot write to it,
          #   even though the installer itself succeeded.
          if ! output=$(sh scripts/install.sh 2>&1); then
            reason=$(printf '%s\n' "$output" | grep '^openheron:' | tail -1)
            printf '%s\n' "$output" >&2
            echo "::error title=the installer failed::${reason:-install.sh exited non-zero}"
            exit 1
          fi
          printf '%s\n' "$output"
      - name: install it (windows)
        if: matrix.script == 'ps1'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          # ★ $env:VERSION, not ${VERSION}: PowerShell does **not** import the
          #   environment into its variable namespace, so "${VERSION}" expands
          #   to an empty string — the pattern becomes
          #   "openheron__windows_amd64.*", matches nothing, and the step dies
          #   on "[0] of a null array". The bash leg gets this right by
          #   accident: in a shell, ${VERSION} *is* the environment.
          $archive = Get-ChildItem "assets/openheron_$($env:VERSION)_${{ matrix.os }}_${{ matrix.arch }}.*" |
            Select-Object -First 1
          # ★ The asset is named after the matrix, so a miss here is a broken
          #   handoff, not a broken installer — say which one it is, and say
          #   what *is* there.
          if (-not $archive) {
            $listing = (Get-ChildItem assets | ForEach-Object { $_.Name }) -join ", "
            throw "no asset for ${{ matrix.os }}-${{ matrix.arch }} (VERSION=$($env:VERSION)) under assets/; assets holds: $listing"
          }
          $env:OPENHERON_ASSET = $archive.FullName
          $env:OPENHERON_CHECKSUMS = (Resolve-Path "assets/checksums.txt").Path
          $env:OPENHERON_VERSION = $env:VERSION
          $env:INSTALL_DIR = Join-Path $env:LOCALAPPDATA "Programs\openheron"
          # ★ What the next line failed on, printed before it runs: a failure
          #   without these three lines is a failure nobody can act on.
          Write-Host "policy: $(Get-ExecutionPolicy)"
          Write-Host "asset: $($env:OPENHERON_ASSET)"
          Write-Host "install dir: $($env:INSTALL_DIR)"
          # ★ The installer runs as a child process, and the policy is passed
          #   on its command line: a .ps1 file invoked in this session is
          #   refused outright when the runner's policy is Restricted, and the
          #   script never runs — the step fails in a second with nothing but
          #   the refusal. A child process also turns the installer's own
          #   "exit 1" into an exit code instead of killing the step, so the
          #   reason can be reported as an annotation — readable from the API
          #   by anyone, while the job log needs admin rights.
          $output = & pwsh -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ./scripts/install.ps1 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Host $output
          if ($code -ne 0) {
            $reason = ($output -split "`n" | Where-Object { $_ -match "openheron:" } | Select-Object -Last 1)
            # ★ The annotation must not fail on its own: a missing line here
            #   would replace the real reason with a null-reference error.
            $reason = if ($reason) { $reason.Trim() } else { "the installer exited $code" }
            Write-Host "::error title=the Windows installer failed::$reason"
            exit $code
          }
      - name: check the installed binary
        if: matrix.script == 'sh'
        shell: bash
        run: |
          set -euo pipefail
          got="$("$HOME/.local/bin/openheron" version)"
          echo "the installed binary reports: ${got}"
          test "$got" = "$VERSION"
      - name: check the installed binary (windows)
        if: matrix.script == 'ps1'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $exe = Join-Path $env:LOCALAPPDATA "Programs\openheron\openheron.exe"
          $got = (& $exe version).Trim()
          Write-Host "the installed binary reports: $got"
          if ($got -ne $env:VERSION) { throw "the installed binary reports $got" }

  publish:
    name: publish the release
    # ★ The release becomes public only after every platform installed it.
    needs: [install]
    if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      VERSION: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: turn the draft into the release
        run: |
          set -euo pipefail
          # ★ The draft is found through the LIST endpoint, not through
          #   releases/tags/{tag}: a draft release is not served by that
          #   endpoint — it answers 404 — and the list endpoint is the one
          #   that shows drafts to a caller with push access, which the
          #   GITHUB_TOKEN here has. Looking the draft up by tag is how this
          #   job died on every release so far: the 404 failed the command
          #   substitution under "set -e", and the PATCH never ran.
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
            --jq ".[] | select(.tag_name == \"$VERSION\" and .draft == true) | .id" | head -1)
          if [ -z "$id" ]; then
            # ★ Already public — a re-run of an existing tag. Patching it again
            #   is harmless, and failing here would block a release that is
            #   already out.
            id=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
              --jq ".[] | select(.tag_name == \"$VERSION\") | .id" | head -1)
          fi
          if [ -z "$id" ]; then
            echo "::error title=no release for $VERSION::the release job did not create one"
            exit 1
          fi
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$id" -F draft=false
          echo "published: $VERSION (release $id)"

  kit:
    name: kit (build + push to Docker Hub)
    # ★ A tag on a red commit publishes nothing: the checks come first, and
    #   so does the secret scan — a tag whose commit holds a key should not
    #   become a published image either.
    #
    # ★ The Kit is a **separate artifact** from the release, and it waits for
    #   the same checks rather than for the release: the two publish different
    #   things, and neither one should wait for the other.
    needs: [go, web, e2e, secrets]
    if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # ★ The tag, not `git describe`: a shallow clone has no tags, and the
      #   tag is the version the release is published under anyway.
      VERSION: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          # ★ Full history: `task build` falls back to the version from
          #   `git describe --tags`, and a shallow clone would find no tag.
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: oven-sh/setup-bun@v2
      - name: install Task
        uses: go-task/setup-task@v2
      - name: log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: build and push the Kit
        # ★ The image is tagged without the `v`: the release is v0.1.0 and the
        #   Kit is 0.1.0, so that the reference in the guide is the tag.
        #
        # ★ `task kit-push` builds the binary first (`task build`) and pushes
        #   the workload and every mixin. The binary it carries is this
        #   commit's own build, and it reports the tag the release reports.
        #
        # ★ It also points `latest` at what it just pushed. The guide names
        #   `latest`, so that a release does not have to edit the guide — and
        #   the guide is what most people read.
        #
        # ★ The assignment applies to both tasks in the invocation: Task
        #   shares CLI variables across every task named on the command line.
        run: task kit-push kit-push-mixin KIT_VERSION="${VERSION#v}"
      - name: check what was published
        # ★ The push is only a claim until something reads it back: the
        #   registry has to serve the tag, and the descriptor inside it has to
        #   carry the version the image is tagged with.
        #
        # ★ `latest` is checked too, and it is checked for the same reason:
        #   the guide points at it, so a missing `latest` is a guide that does
        #   not work.
        run: |
          set -euo pipefail
          version="${VERSION#v}"
          for image in openheron-kit openheron-kit-deepseek openheron-kit-openai; do
            for tag in "$version" latest; do
              ref="docker.io/ouranoshong/${image}:${tag}"
              digest=$(docker buildx imagetools inspect "$ref" --format '{{.Manifest.Digest}}')
              echo "${image}:${tag} -> ${digest}"
              if [ -z "$digest" ]; then
                echo "::error title=the Kit was not published::${ref} does not resolve"
                exit 1
              fi
            done
            # ★ The two tags have to be the same image: `latest` is a pointer,
            #   and a pointer to something else is a lie the guide would tell.
            versioned=$(docker buildx imagetools inspect "docker.io/ouranoshong/${image}:${version}" --format '{{.Manifest.Digest}}')
            latest=$(docker buildx imagetools inspect "docker.io/ouranoshong/${image}:latest" --format '{{.Manifest.Digest}}')
            if [ "$versioned" != "$latest" ]; then
              echo "::error title=latest does not point at the release::${image} latest is ${latest}, the release is ${versioned}"
              exit 1
            fi
          done

  install-script:
    name: install script (local fake release)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: install Task
        uses: go-task/setup-task@v2
      - name: test the installer
        run: task test-install

  secrets:
    name: secrets (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: fetch gitleaks
        # ★ The open-source **binary**, not the action: the action runs a
        #   licence check, while the scanner itself is MIT. ★ The checksum is
        #   pinned as well — a binary fetched over the network without one is
        #   exactly what this job exists to catch.
        run: |
          set -euo pipefail
          version=8.30.1
          curl -fsSL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          chmod +x gitleaks
          ./gitleaks version
      - name: scan the whole history
        # ★ The whole history, not the diff: a secret committed once is still
        #   in there, and the pre-commit hook only ever sees what comes next.
        #
        # ★ **No `--log-opts` here, on purpose.** Without it, gitleaks scans
        #   `git log -p -U0 --full-history --all --diff-filter=tuxdb` — every
        #   ref the checkout holds. Adding `--log-opts` REPLACES that command
        #   with the given arguments, and `--all` is not among them: the scan
        #   silently narrows to the commits reachable from HEAD
        #   (gitleaks/sources/git.go:93-94). A narrower scan that still
        #   passes is the worst kind of gap, so the flag stays off unless
        #   someone measures that the default misses something.
        #
        # ★ The range is the checkout's, and the checkout's is wide:
        #   `fetch-depth: 0` is "all history for all branches and tags", and
        #   a pull request is checked out as its merge commit — the branch's
        #   own commits are its parents, so they are in the range too.
        run: ./gitleaks detect --source . --redact --verbose
