# openheron CI — checks on every push, and the release on a tag.
#
# ★ One file, one reason: the release job **waits for the checks**, so a tag
#   on a red commit publishes nothing. Two workflow files could not express
#   that (a job cannot `needs:` a job in another workflow), so they would
#   have to re-run the checks here — the same recipe in two places.
#
# ★ The commands are the repo's own: `make lint-go`, `make test`,
#   `make test-e2e`. What CI runs is what a developer runs locally; the
#   recipe stays in the Makefile.
#
# ★ The smokes are **not** here: `make smoke` needs a model that answers, and
#   a model that answers is not reproducible in CI. The E2E uses the fake
#   backend it ships with — that half is deterministic, so it belongs here.

name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: "release this tag (e.g. v0.1.0); leave empty to only run the checks"
        required: false
        type: string

# ★ A new push makes the previous run pointless — cancel it.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  go:
    name: go (vet + gofmt + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          # ★ The version comes from go.mod, not from a literal here: the two
          #   would drift, and the drift is a build that fails on the runner
          #   and nowhere else.
          go-version-file: go.mod
          cache: true
      - run: make lint-go
      - run: make test

  web:
    name: web (lint + types + unit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - name: install the dependencies
        working-directory: web
        run: bun install --frozen-lockfile
      - run: make lint-web
      - name: unit tests
        working-directory: web
        run: bun run test:unit

  e2e:
    name: e2e (playwright, fake backend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - name: install the dependencies
        working-directory: web
        run: bun install --frozen-lockfile
      - name: install the browser
        working-directory: web
        # ★ Only chromium: the config declares one project, and installing
        #   every browser would cost minutes for nothing.
        run: bun x playwright install --with-deps chromium
      - name: e2e
        # ★ The command stays the repo's own (`make test-e2e`); the tee is
        #   only there so that a failure can be summarized **where it can be
        #   read**: the job log and the artifacts need authentication, the
        #   step summary does not. A CI that fails without saying what failed
        #   is a CI nobody can act on.
        run: |
          set -o pipefail
          make test-e2e 2>&1 | tee /tmp/e2e.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            summary=$(grep -E "✘|[0-9]+\) |Error:|Timed out|failed|passed" /tmp/e2e.log \
              | tail -15 | tr '\n' ' ' | cut -c1-900)
            echo "::error title=E2E failed::${summary}"
            {
              echo "### E2E failed"
              echo '```'
              echo "${summary}"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"
      - name: keep the report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            web/playwright-report/
            /tmp/e2e.log
          retention-days: 7

  release:
    name: release
    # ★ A tag on a red commit publishes nothing: the checks come first.
    #
    #   ★ The string literals are **single** quotes: GitHub's expression
    #     parser does not accept double quotes, and the whole workflow file is
    #     rejected when one expression does not parse (which shows up as a
    #     failed run with zero jobs, not as a failing job).
    needs: [go, web, e2e]
    if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # ★ The tag, not `git describe`: a shallow clone has no tags, and the
      #   tag is the version the release is published under anyway.
      VERSION: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          # ★ Full history: `make release` reads the version from
          #   `git describe --tags`, and a shallow clone would find no tag.
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: oven-sh/setup-bun@v2
      - name: build the artifacts
        # ★ `make release` builds the frontend **first**: web/dist is the
        #   target of //go:embed, so building the backend first would publish
        #   a binary with no interface.
        #
        #   ★ VERSION reaches the build through the environment: the Makefile
        #   reads it with `?=`, so the environment wins over `git describe`.
        run: make release
      - name: check the version inside the artifact
        run: |
          set -euo pipefail
          dir="openheron_${VERSION}_linux_amd64"
          tar -xzf "dist/${dir}.tar.gz" -C /tmp
          got="$(/tmp/${dir}/openheron version)"
          echo "the binary reports: ${got}"
          if [ "$got" != "$VERSION" ]; then
            echo "the version was not stamped into the binary" >&2
            exit 1
          fi
      - name: keep the assets for the install check
        # ★ The install job installs **these** bytes — the same ones the
        #   release publishes. Handing them over as an artifact avoids
        #   depending on a draft being downloadable: a draft's assets are
        #   not reachable by tag, so `gh release download` cannot fetch them.
        uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: dist/
          retention-days: 1
      - name: publish
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.VERSION }}
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          # ★ Draft first: the release only goes public after the install job
          #   has installed the very assets this job produced. A release that
          #   nobody can install is a bad thing to have published already.
          draft: true

  install:
    name: install (${{ matrix.os }}-${{ matrix.arch }})
    # ★ The assets are installed and run on every platform we publish for, so
    #   "the release works" means the binary was actually installed and
    #   reported its version — not that a tarball existed.
    needs: [release]
    if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
    runs-on: ${{ matrix.runner }}
    permissions:
      # ★ Read only: this job installs and runs, it publishes nothing.
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            os: linux
            arch: amd64
            script: sh
          - runner: ubuntu-24.04-arm
            os: linux
            arch: arm64
            script: sh
          - runner: macos-latest
            os: darwin
            arch: arm64
            script: sh
          - runner: macos-13
            os: darwin
            arch: amd64
            script: sh
          - runner: windows-latest
            os: windows
            arch: amd64
            script: ps1
    env:
      VERSION: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
      - name: get the assets the release job built
        uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: assets
      - name: install it
        if: matrix.script == 'sh'
        shell: bash
        run: |
          set -euo pipefail
          archive=$(ls assets/openheron_${VERSION}_${{ matrix.os }}_${{ matrix.arch }}.*)
          export OPENHERON_ASSET="$archive"
          export OPENHERON_CHECKSUMS="assets/checksums.txt"
          export OPENHERON_VERSION="$VERSION"
          export INSTALL_DIR="$HOME/.local/bin"
          sh scripts/install.sh
      - name: install it (windows)
        if: matrix.script == 'ps1'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $archive = (Get-ChildItem "assets/openheron_${VERSION}_${{ matrix.os }}_${{ matrix.arch }}.*")[0].FullName
          $env:OPENHERON_ASSET = $archive
          $env:OPENHERON_CHECKSUMS = (Resolve-Path "assets/checksums.txt").Path
          $env:OPENHERON_VERSION = $env:VERSION
          $env:INSTALL_DIR = Join-Path $env:LOCALAPPDATA "Programs\openheron"
          & ./scripts/install.ps1
      - name: check the installed binary
        if: matrix.script == 'sh'
        shell: bash
        run: |
          set -euo pipefail
          got="$("$HOME/.local/bin/openheron" version)"
          echo "the installed binary reports: ${got}"
          test "$got" = "$VERSION"
      - name: check the installed binary (windows)
        if: matrix.script == 'ps1'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $exe = Join-Path $env:LOCALAPPDATA "Programs\openheron\openheron.exe"
          $got = (& $exe version).Trim()
          Write-Host "the installed binary reports: $got"
          if ($got -ne $env:VERSION) { throw "the installed binary reports $got" }

  publish:
    name: publish the release
    # ★ The release becomes public only after every platform installed it.
    needs: [install]
    if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      VERSION: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: turn the draft into the release
        run: |
          set -euo pipefail
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$VERSION" --jq .id)
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$id" -F draft=false
          echo "published: $VERSION"

  install-script:
    name: install script (local fake release)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: test the installer
        run: make test-install
