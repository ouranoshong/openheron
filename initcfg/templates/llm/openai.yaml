# ★ Factory template: one OpenAI-compatible endpoint.
#   The placeholder defaults live in this file — **vendor knowledge never enters
#   the Go code**.
type: openai_compat
base_url: {{base_url|https://api.openai.com/v1}}

# ★ api_key holds the **name of an environment variable**, rendered as ${NAME}.
#   The key is read from the environment only when a request is made: an unset
#   variable does not block startup, it only records one reminder.
api_key: {{api_key_env|OPENAI_API_KEY}}

timeout: 5m

models:
  - id: {{model|gpt-4o}}
    context_window: 128000
