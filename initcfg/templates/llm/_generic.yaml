# ★ Generic template: **no default endpoint** — --base-url must be given explicitly.
#   Endpoints are never guessed: a wrong guess hands the user a 404, which is far
#   more expensive than an outright error.
type: openai_compat
base_url: {{base_url}}

# ★ api_key holds the **name of an environment variable**, rendered as ${NAME}.
api_key: {{api_key_env}}

timeout: 5m

models:
  - id: {{model}}
    context_window: 0

    # ★ summarize_at is the token count at which the conversation is compacted
    #   into a summary. 0 means never: the context grows until the endpoint
    #   refuses the request. 80-90% of context_window is the usual choice —
    #   a request that exactly fills the window is a request that gets
    #   refused.
    summarize_at: 0
