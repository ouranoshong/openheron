# The three arms of the benchmark.
#
# ★ A is the hypothesis: a strong model decomposes, cheap models execute.
#   B is the baseline: one strong model does everything. C is the control
#   that keeps the conclusion honest: one cheap model does everything.
#   Without C, "A is cheaper than B" may only mean "flash is cheaper than
#   max" — the decomposition would not have earned anything.
#
# The agents' prompts live in agents/, one file per agent per arm. The
# model references are `provider/model`; the provider prefix is whatever your
# llm/<provider>.yaml is called.

# ── the price table ────────────────────────────────────────────────────────
#
# ★ CNY per million tokens, as of 2026-10-31. Prices move: the report
#   therefore carries both the absolute CNY and the ratio to arm B, and the
#   ratio is the number that survives a price change.
#
# ★ VERIFIED against the vendor's own bill on 2026-11-01 (Bailian / DashScope,
#   cn-beijing, API Key 7352725). Every rate back-solves from the billed
#   amount and the billed token count with zero residual:
#     max   fresh 12.0000  output 36.0000  cached 1.5000
#     flash fresh  0.8000  output  2.7000  cached 0.1000
#   The numbers below are the billed ones, not a reading of the price page.
prices:
  qwen3.8-max:
    input: 12
    output: 36
    cached_input: 1.5
  qwen3.8-flash:
    input: 0.8
    output: 2.7
    cached_input: 0.1

# ── the arms ───────────────────────────────────────────────────────────────
#
# ★ The baseline is the arm every other arm is measured against. It is
#   declared here rather than guessed in code: "the strong model does it
#   all" is the alternative the decomposition has to beat, so it is the
#   only meaningful denominator. A run that does not include the baseline
#   falls back to the first arm it has.
baseline: b-max-solo

arms:
  # A: the strong model decomposes, the weak model executes.
  - id: a-max-parent-flash-workers
    label: "强模型分解 + 弱模型执行"
    agents:
      - file: agents/a-main.md
        id: main
        role: parent
        model: qwen/qwen3.8-max
      - file: agents/a-task.md
        id: task
        role: worker
        model: qwen/qwen3.8-flash

  # ★ A′: the same shape as A, with the worker's report reduced to
  #   conclusions and citations.
  #
  #   The hypothesis under test: A's acceptance cost is high because the
  #   worker pastes whole files and the parent re-reads them. A′ changes
  #   both ends of that one chain — the worker reports less, the parent
  #   spot-checks instead of re-reading. It is deliberately **one** variable
  #   (the report form), not two: splitting it would need four arms, and the
  #   sample could not carry that.
  - id: a2-max-parent-flash-workers-cited
    label: "强模型分解 + 弱模型执行（子回报结论+引用）"
    agents:
      - file: agents/a2-main.md
        id: main
        role: parent
        model: qwen/qwen3.8-max
      - file: agents/a2-task.md
        id: task
        role: worker
        model: qwen/qwen3.8-flash

  # ★ A″: the same shape as A′, with the **investigation** delegated too.
  #
  #   A′ still has the parent read the code itself before it writes the work
  #   order — and that reading is the parent's single most expensive phase
  #   (56.5 % of its tokens). A″ puts a read-only scout in front: the scout
  #   reads the code on the cheap model and reports facts with `file:line`
  #   citations; the parent decides from those citations and never opens a
  #   file itself.
  #
  #   ★ The scout runs on **flash** on purpose. The hypothesis is that moving
  #     the reading to the cheap model is what pays; a scout on the strong
  #     model would keep the cost where it was. If the quality drops, the
  #     finding is that the investigation needs the strong model.
  - id: a3-max-parent-flash-workers-scouted
    label: "强模型规划 + 弱模型调研 + 弱模型落地"
    agents:
      - file: agents/a3-main.md
        id: main
        role: parent
        model: qwen/qwen3.8-max
      - file: agents/a3-scout.md
        id: scout
        role: investigator
        model: qwen/qwen3.8-flash
      - file: agents/a3-task.md
        id: task
        role: worker
        model: qwen/qwen3.8-flash

  # ★ A″′: A″ with the two problems it measured fixed.
  #
  #   A″ measured at 0.587 of B, but the repeats exposed two defects:
  #
  #   1. **The scout's report was longer than the worker's** — 16,633
  #      characters against 6,921. The investigation stage became the
  #      expensive one, because "here is what the code does" is a longer
  #      answer than "here is what I changed", and the parent pays full
  #      price for reading it. a4's scout reports **where the change has to
  #      go**, not what the code currently is.
  #   2. **The parent could abandon the shape half-way** — on one run it
  #      called the scout twice and then reported the scout's findings as
  #      its answer, having never delegated the implementation. a4's parent
  #      is told that the implementation step is not optional and that
  #      findings are not a result.
  #
  #   The worker prompt is unchanged: the fixes are in the parent's sequence
  #   and in the scout's report, so a4 reuses A″'s worker file.
  - id: a4-max-parent-flash-workers-scouted-tight
    label: "强模型规划 + 弱模型调研（精简报告）+ 弱模型落地"
    agents:
      - file: agents/a4-main.md
        id: main
        role: parent
        model: qwen/qwen3.8-max
      - file: agents/a4-scout.md
        id: scout
        role: investigator
        model: qwen/qwen3.8-flash
      - file: agents/a3-task.md
        id: task
        role: worker
        model: qwen/qwen3.8-flash

  # B: the strong model does everything, with the union of the tools.
  - id: b-max-solo
    label: "强模型单干"
    agents:
      - file: agents/b-solo.md
        id: main
        role: solo
        model: qwen/qwen3.8-max

  # C: the control. The weak model does everything.
  - id: c-flash-solo
    label: "弱模型单干（对照）"
    agents:
      - file: agents/c-solo.md
        id: main
        role: solo
        model: qwen/qwen3.8-flash

# ★ The cost of a message is looked up by the agent that produced it, using
#   the model named in the arm table above — so the arms and the price table
#   cannot drift apart.
