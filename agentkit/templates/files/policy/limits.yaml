# Limit rules: caps on quantities.
#
# ★ They can only **tighten** — to relax a cap, change server/config.yaml (requires a restart).
#   Tightening takes effect immediately: policy/ is hot-reloaded.
# ★ 0 = no limit, fall back to the global value in server/config.yaml.
#
# agent.max_depth   max nesting depth (the entry agent is level 0)
# retry.max_retries max retries for model calls
agent:
  max_depth: 0
retry:
  max_retries: 0
