# ★ Factory template: one OpenAI-compatible endpoint.
#   The placeholder defaults live in this file — **vendor knowledge never enters
#   the Go code**.
type: openai_compat
base_url: {{base_url|https://api.openai.com/v1}}

# ★ The api key is **not** in this file. The provider's name is the file's
#   name, and the name says where the key comes from:
#
#     the environment variable LLM_OPENAI_API_KEY, or
#     the keyring entry llm:openai
#
# ★ The environment wins when both are there. Store one with
#   `openheron secret set llm openai`, or export the variable — a key that is
#   in neither place is one reminder away from a 401.

timeout: 5m

models:
  - id: {{model|gpt-4o}}
    context_window: 128000
