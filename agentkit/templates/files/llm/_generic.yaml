# ★ Generic template: **no default endpoint** — --base-url must be given explicitly.
#   Endpoints are never guessed: a wrong guess hands the user a 404, which is far
#   more expensive than an outright error.
type: openai_compat
base_url: {{base_url}}

# ★ The api key is **not** in this file. The provider's name is the file's
#   name, and the name says where the key comes from:
#
#     the environment variable LLM_<PROVIDER>_API_KEY, or
#     the keyring entry llm:<provider>
#
#   ★ Rename this file to llm/<provider>.yaml and the names follow it.
#   ★ The environment wins when both are there. Store one with
#   `openheron secret set llm <provider>`, or export the variable — a key that
#   is in neither place is one reminder away from a 401.

timeout: 5m

models:
  - id: {{model}}
    # ★ context_window is the size of the model's context. Fill it in: the
    #   automatic compaction of an agent is measured against it, and without
    #   it there is nothing to measure against.
    context_window: 0
