# tools/web_search.yaml
#
# Web search. Writing this file enables it.
#
# ★ provider: the code only knows **duckduckgo**. (An earlier version of this
#   template also mentioned searxng; that is out of date.)
provider: duckduckgo      # the only provider the code accepts
max_results: 10
timeout: 60s              # a search has to page through results, so it gets more room than HTTP
region: ""                # empty = worldwide; duckduckgo's kl parameter (wt-wt / cn-zh / ...)

# ★ The tools that run **without a nod**.
allows: [duckduckgo_search]

# ★ proxy: the proxy the search goes through. Empty is **no proxy** — the tool
#   dials the target itself and refuses a target that is not a public address.
#   A proxy **replaces** that rule instead of adding to it: the proxy is then
#   the boundary, and the target may be any address it can reach. Three
#   settings: "" (no proxy), a URL (that proxy; the environment is ignored),
#   and "env" (the environment decides — HTTP_PROXY / HTTPS_PROXY / NO_PROXY,
#   read once when the tool is built). Schemes: http, https, socks5, socks5h.
#   A wrong one is a load-time error.
proxy: ""
