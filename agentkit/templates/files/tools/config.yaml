# tools/config.yaml
#
# The configuration tools. ★ They are **always mounted** — the provider
#   answers from the configuration service, and no file switches them on.
#   This file names their exceptions and tunes them.
#
# The tools this file configures:
#   config_get  config_validate  config_template  config_notices
#   config_tier  config_write
#
# ★ `allows:` is **additive**, like every other file under tools/: a name
#   here joins the exceptions and never takes one away. It speaks **this
#   file's own vocabulary** — the tool names as they are exposed.
#
# ★ Absent, every tool this provider offers asks — the read-only ones
#   included: this file is what says that a question about the
#   configuration does not cost an approval.
#
# ★ `config_write` is not named below, and that is a **default, not a rule**:
#   it edits the configuration — this file among them — so a change to the
#   configuration should cost an approval. Nothing forbids naming it; to let
#   an agent rewrite the configuration unattended, replace the line below
#   with this one:
#
#   allows: [config_get, config_validate, config_template, config_notices, config_tier, config_write]
#
# ★ The largest file `config_get` hands back. It **refuses** a file bigger
#   than this rather than truncating it: a tool that returns half a file
#   invites the model to edit the half it got and write it back.
#   1024..1048576; the default is 65536.
allows: [config_get, config_validate, config_template, config_notices, config_tier]

max_read_bytes: 65536
