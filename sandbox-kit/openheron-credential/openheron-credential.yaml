# syntax=docker/sandbox-kit:3
#
# The openheron model credential, as a mixin.
#
# ★ A mixin is an overlay that lands on a workload's filesystem. It carries no
#   content of its own — it carries declarations. This one declares the
#   credential and nothing else, so the workload stays vendor-neutral: which
#   provider, which endpoint and which variable name are the user's business.
#
# ★ Compose it onto the workload:
#     sbx run ./sandbox-kit/openheron --kit ./sandbox-kit/openheron-credential .
#   Without it, the workload asks for no credential at all and the user
#   injects the key themselves (which puts the key inside the sandbox).
#
# ★ The declarations below mirror openheron's factory defaults, because the
#   provider config the workload's startup hook writes references them:
#     DEEPSEEK_API_KEY    initcfg/templates/llm/deepseek.yaml (api_key)
#     api.deepseek.com    initcfg/templates/llm/deepseek.yaml (base_url)
#   Change them together with the config on the user's mount, or compose a
#   different mixin.
#
# The design this implements is docs/sandbox-kit-design.md.

schemaVersion: "3"
kind: mixin
displayName: openheron credential
description: the model credential for an openheron workload, injected by the host proxy
licenses: [Apache-2.0]

capabilities:
  # ★ The network rule and the credential travel together, and they have to.
  #   The runtime checks that every inject domain appears **literally** in the
  #   network policy's allow list for the same phase — the workload's bare "*"
  #   covers every domain but does not satisfy that check, so the mixin names
  #   the host outright. The lists union per phase, so the workload's "*" and
  #   this one both stand.
  - type: com.docker.sandbox/network-policy@1
    config:
      runtime:
        allow:
          - api.deepseek.com

  # ★ proxyManaged: the real value stays on the host's secret store; the
  #   container only ever sees the sentinel "proxy-managed", and the proxy
  #   swaps in the real value on the way out.
  #
  # ★ The user binds the key with ONE command, and the placeholder it uses is
  #   the sentinel itself, so the runtime's injection and the host's binding
  #   agree without the user passing an environment variable:
  #     printf '%s' "$DEEPSEEK_API_KEY" | sbx secret set-custom \
  #       --host api.deepseek.com --env DEEPSEEK_API_KEY \
  #       --placeholder proxy-managed --value-stdin
  #   The real key never enters the sandbox.
  #
  # ★ The service name is what a *service* binding would be keyed by; it is
  #   required by the schema either way.
  - type: com.docker.sandbox/credential@1
    optional: true
    description: model API access
    config:
      service: deepseek
      phase: runtime
      apiKey:
        name: DEEPSEEK_API_KEY
        proxyManaged: true
        inject:
          - {domain: api.deepseek.com, header: Authorization, format: "Bearer %s"}
