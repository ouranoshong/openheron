# The openheron sandbox, managed by Docker Compose.
#
# ★ Compose drives the sandbox through the `sbx` provider: compose resolves
#   this file, then calls `sbx compose up|down|stop|pull` for this service.
#   The provider is the one that owns the sandbox; compose owns the
#   lifecycle around it.
#
# ★ `image:` is the workload Kit's published image. The runtime pulls it and
#   starts the openheron server inside the microVM; the port the workload
#   declares (container 8080) is published on an ephemeral host port.
#
# ★ The vendor credential comes from the host's own secret store, not from
#   this file: a mixin declares which vendor and which domain, and the key
#   itself never travels in a compose file.
#
# ★ There is no `volumes:` here on purpose. The sbx provider rejects it —
#   a sandbox has its own isolated filesystem. The workspace is mounted by
#   the runtime, and the file that asks for it is `sbxenv.yaml`, next to
#   this one.
#
# Start it:
#
#   docker compose up -d
#
# Stop and remove it:
#
#   docker compose down

services:
  openheron:
    image: docker.io/ouranoshong/openheron-kit:0.0.6
    provider:
      type: sbx
