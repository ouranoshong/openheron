# ★ The demo lets the agent run commands without a prompt, so that the
#   demonstration needs nobody at the keyboard.
#
#   A real workspace would keep `execute` in the ask column: a shell command
#   has consequences, and the agent should ask before it runs one. This file
#   is here to show that the policy is **yours** — it lives in the workspace,
#   it is read on every turn, and openheron init keeps it rather than
#   overwriting it.
ask:   [write_file, edit_file, kb_index]
deny:  []
