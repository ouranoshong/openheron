type: openai_compat
base_url: https://api.openai.com/v1
api_key: ${OPENAI_API_KEY}
timeout: 5m

# The field names this endpoint uses — only used to give an accurate hint when a request is rejected.
# The protocol layer hardcodes no vendor's field names.
hint_keys: ["reasoning_effort"]

# provider-level dialect, shared by all models
extra:
  stream: true

models:
  - id: gpt-4o
    context_window: 128000

  - id: o3
    context_window: 200000
    # Tier vocabulary: tier name → the field this endpoint sends it as.
    # An agent only writes `reasoning: high`; it does not need to know what shape
    # "high" has at this vendor.
    reasoning:
      off:  {}                                    # send no thinking field at all
      low:  { reasoning_effort: low }
      high: { reasoning_effort: high }
    reasoning_default: low                        # used when the agent writes no reasoning
    # Thinking models are an order of magnitude slower, so the provider-level timeout can be overridden
    timeout: 30m
