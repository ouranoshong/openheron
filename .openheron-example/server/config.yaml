# The process's own configuration.
# ★ This directory is **not hot-reloaded** — a change needs a restart.
#
#   The configuration of external tools (http / web_search / wikipedia) and of the
#   knowledge base lives in the tools/ directory, and that side **is**
#   hot-reloaded — a change takes effect on the next turn.

listen_addr: ":8080"
static_dir: static        # resolved relative to the **project root** (<root>/static)
data_dir: state           # runtime data; in practice Service.StateDir() = <root>/.openheron/state

# Upper bound for one turn, from submission to entering the running state
start_timeout: 60s

# How long a run's lease survives without progress. A run that reports
# nothing for this long loses the lease, however alive it is — so it must be
# **longer than the provider's own timeout** (llm/<id>.yaml), or a slow but
# alive model is fenced out while it is thinking.
lease_ttl: 10m

retry:
  max_retries: 5

agent:
  # Max nesting depth. **The entry agent (the one the session selected) is level 0**;
  # an agent at depth d may spawn sub-agents if and only if d < max_depth.
  # 1 = only the entry agent may delegate.
  # A declared topology that exceeds the limit is **an error at startup**; it is
  # never silently truncated.
  max_depth: 1

  # ★ **Every declared agent can be the agent of a session** — there is no "main
  #   agent", and no derivation of a "candidate main agent" either. Whichever one
  #   the session selects becomes level 0 and expands its own team (each with its
  #   own subagents:).
  #   See docs/multi-agent-design.md §4.

# Changes under llm/ agents/ policy/ tools/ are discovered automatically and swap the generation; server/ does not
watch:
  enabled: true
  debounce: 200ms
