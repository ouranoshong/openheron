# Limit rules — caps on quantities.
#
# ★ The division of labor with permissions.yaml is **orthogonal**:
#
#   permissions.yaml: does this tool need a human nod (approval decision)
#   limits.yaml:      how much of it may be done at most (quota cap)
#
# ★ They can only **tighten**, never relax.
#
#   The value here and the value of the same name in server/config.yaml — the
#   **stricter** one wins; between the user level and the project level it is the
#   stricter one as well — limits are a safety boundary, the project level can
#   only tighten, never relax.
#
#   To relax a cap, change server/config.yaml (process-level config, needs a
#   restart). Tightening takes effect **immediately**: policy/ is hot-reloaded,
#   so saving the change swaps the generation.
#
# ★ 0 = no limit, fall back to the global value in server/config.yaml.
#
# ★ Declaring a value looser than the global baseline is a **no-op** — it lands in
#   deferred, and startup prints it to tell you "this value did not take effect".
#
# agent.max_depth   max nesting depth. The root agent is level 0; an agent at
#                   depth d may spawn sub-agents if and only if d < max_depth.
# retry.max_retries max retries after a model call fails.
agent:
  max_depth: 0
retry:
  max_retries: 0
